name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  firmware:
    name: firmware (pio check + build)
    runs-on: ubuntu-latest
    # PIO toolchain in CI is heavy and can flake on first-run platform
    # downloads; we don't want a transient failure to block the web
    # gate. Keep this informational until the toolchain is cached
    # locally.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: pio check (cppcheck)
        run: pio check --skip-packages || true
      - name: pio run (esp32dev)
        run: pio run -e esp32dev
