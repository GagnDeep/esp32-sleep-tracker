; PlatformIO project configuration.
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
; Default to the classic ESP32 (Xtensa LX6, CP2102 USB-UART bridge). Override
; with `pio run -e esp32c3` for the ESP32-C3 DevKitM-1 (native USB-JTAG).
default_envs = esp32dev
src_dir      = firmware/src
include_dir  = firmware/include
data_dir     = firmware/data

[env]
framework        = arduino
monitor_speed    = 115200
upload_speed     = 921600
board_build.filesystem  = littlefs
board_build.partitions  = firmware/partitions_custom.csv

build_flags =
    ; Framework log macros (log_w/log_e/log_i) bypass our logging::setSilent
    ; and write directly to Serial. Keeping them enabled poisons the
    ; Improv-Serial channel during boot with Wire/LittleFS/sd_diskio
    ; chatter and breaks "Improv Wi-Fi Serial not detected" recovery.
    ; Our app code uses LOG_x macros which respect setSilent and stream
    ; cleanly to UART once WiFi is up; framework chatter is unneeded.
    -DCORE_DEBUG_LEVEL=0
    -DASYNCWEBSERVER_REGEX
    -DCOHERENCE_TEST_MODE=0
    -std=gnu++17
build_unflags =
    -std=gnu++11

lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    electroniccats/MPU6050@^1.0.1
    bblanchon/ArduinoJson@^7.1.0
    me-no-dev/AsyncTCP@^1.1.1
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    tzapu/WiFiManager@^2.0.17

[env:esp32dev]
platform = espressif32
board    = esp32dev
; To pre-flash WiFi creds (skip captive portal), append build_flags here, e.g.
;   -DWIFI_PRESET_SSID=\"MyNetwork\" -DWIFI_PRESET_PASS=\"secret\"
; or pass via PLATFORMIO_BUILD_FLAGS env var. Credentials persist to NVS on
; first connect and are picked up by WiFiManager on subsequent boots.

[env:esp32c3]
platform = espressif32
board    = esp32-c3-devkitm-1
; ARDUINO_USB_MODE=1 + CDC_ON_BOOT=1 maps Serial to the USB-Serial-JTAG
; CDC endpoint so logs come over USB without needing a UART adapter.
; WM_NODEBUG silences WiFiManager which references Serial unguarded.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DWM_NODEBUG
